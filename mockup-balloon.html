<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup — Balloon Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 3rem;
    }

    /* ── OPTION A: Silver / Chrome ─── */
    .balloon-silver {
      font-family: 'Titan One', cursive;
      font-size: clamp(5rem, 14vw, 11rem);
      line-height: 1;
      letter-spacing: -0.02em;
      background:
        radial-gradient(ellipse 55% 45% at 32% 22%, rgba(255,255,255,0.95) 0%, transparent 55%),
        radial-gradient(ellipse 35% 35% at 72% 78%, rgba(0,0,0,0.28) 0%, transparent 55%),
        linear-gradient(140deg, #e2e2e2 0%, #c0c0c0 20%, #8c8c8c 50%, #545454 75%, #2e2e2e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter:
        drop-shadow(0 2px 0px rgba(255,255,255,0.8))
        drop-shadow(0 8px 22px rgba(0,0,0,0.22))
        drop-shadow(0 2px 5px rgba(0,0,0,0.18));
    }

    /* ── OPTION B: Red balloon ─── */
    .balloon-red {
      font-family: 'Titan One', cursive;
      font-size: clamp(5rem, 14vw, 11rem);
      line-height: 1;
      letter-spacing: -0.02em;
      background:
        radial-gradient(ellipse 55% 45% at 32% 22%, rgba(255,220,210,0.95) 0%, transparent 55%),
        radial-gradient(ellipse 35% 35% at 72% 78%, rgba(80,0,0,0.35) 0%, transparent 55%),
        linear-gradient(140deg, #f87060 0%, #e03020 25%, #b81a10 55%, #7a0a06 80%, #400000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter:
        drop-shadow(0 2px 0px rgba(255,180,160,0.6))
        drop-shadow(0 8px 22px rgba(180,0,0,0.22))
        drop-shadow(0 2px 5px rgba(0,0,0,0.18));
    }

    /* ── OPTION C: Gold ─── */
    .balloon-gold {
      font-family: 'Titan One', cursive;
      font-size: clamp(5rem, 14vw, 11rem);
      line-height: 1;
      letter-spacing: -0.02em;
      background:
        radial-gradient(ellipse 55% 45% at 32% 22%, rgba(255,252,220,0.95) 0%, transparent 55%),
        radial-gradient(ellipse 35% 35% at 72% 78%, rgba(80,40,0,0.35) 0%, transparent 55%),
        linear-gradient(140deg, #ffe580 0%, #f0c030 25%, #c88a10 55%, #8a5800 80%, #4a2c00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter:
        drop-shadow(0 2px 0px rgba(255,240,150,0.6))
        drop-shadow(0 8px 22px rgba(160,100,0,0.22))
        drop-shadow(0 2px 5px rgba(0,0,0,0.18));
    }

    .label {
      font-family: Arial, sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.2rem;
      color: #aaa;
      margin-top: -2rem;
    }
  </style>
</head>
<body>
  <div class="balloon-silver">Welcome</div>
  <p class="label">Option A — Silver / Chrome</p>

  <div class="balloon-red">Welcome</div>
  <p class="label">Option B — Red Balloon</p>

  <div class="balloon-gold">Welcome</div>
  <p class="label">Option C — Gold</p>
</body>
</html>
